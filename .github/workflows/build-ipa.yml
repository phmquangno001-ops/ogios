      - name: Install CocoaPods Dependencies
        run: |
          if [ -f "Podfile" ] || [ -f "ios/Podfile" ]; then
            if [ -d "ios" ]; then cd ios; fi
            pod install --repo-update || pod install
            cd "$GITHUB_WORKSPACE"
          fi

      - name: Build Application with Xcode
        run: |
          mkdir -p build/artifacts
          WORKSPACE=$(find . -maxdepth 3 -name "*.xcworkspace" | head -n 1)
          PROJECT=$(find . -maxdepth 3 -name "*.xcodeproj" | head -n 1)
          
          BUILD_CMD="xcodebuild clean build -scheme OGIOS -configuration Release -sdk iphoneos -derivedDataPath build/DerivedData ONLY_ACTIVE_ARCH=NO ARCHS=arm64 CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='-'"
          
          if [ -n "$WORKSPACE" ]; then
            echo "Building workspace: $WORKSPACE"
            $BUILD_CMD -workspace "$WORKSPACE"
          elif [ -n "$PROJECT" ]; then
            echo "Building project: $PROJECT"
            $BUILD_CMD -project "$PROJECT"
          else
            echo "No project or workspace found!"
            exit 1
          fi